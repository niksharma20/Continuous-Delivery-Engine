site_name: Continuous Delivery Engine
site_description: Building Continuous Delivery Pattern using Developer Hub, Serverless Workflows, OpenShift and EDA.
site_author: Nikhil Sharma
repo_url: https://github.com/niksharma20/Continuous-Delivery-Engine
repo_name: niksharma20/Continuous-Delivery-Engine

extra:
  collaborator: Ismail Dhaoui
  collaborator_url: https://github.com/idhaoui

theme:
  name: material
  palette:
    - primary: red
      accent: red
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    
plugins:
  - search
  - include-markdown
  
nav:
  - Home: index.md
  - Setup: content/setup/index.md
  - Module 1: content/modules/module_1/index.md
  - Module 2: content/modules/module_2/index.md
  - Module 3: content/modules/module_3/index.md
  - Conclusion: content/conclusion/conclusion.md
